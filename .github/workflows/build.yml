name: Build ShenglinVcam

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# 默认 token 只有只读权限，回传 commit comment 需要 contents: write
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Precheck (lint, fails fast before downloading Theos)
        run: python3 precheck.py --skip-version

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: 'https://github.com/theos/sdks'
          theos-sdks-branch: 'master'

      - name: Build dylib
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -o pipefail
          make 2>&1 | tee build.log

      # dylib 交给系统时得带一张「身份证」。Theos 链接出来的只是占位空章
      # （CodeDirectory.flags = 0x0，缺 CS_ADHOC），大部分越狱环境不查这个，
      # 但确实存在会查的环境 —— 那种情况下表现是「装上了、也启用了，却完全没效果」，
      # 而且不报错不崩溃，极难定位。
      #
      # codesign 是 macOS 自带的，不用额外装 ldid；ad-hoc 签名不需要证书。
      # 必须放在打包 deb 之前，否则 deb 里装的还是没签的那个。
      - name: Ad-hoc sign dylib
        run: |
          set -e
          codesign --force --sign - ShenglinVcam.dylib
          echo "--- 签名结果 ---"
          codesign -dv --verbose=4 ShenglinVcam.dylib 2>&1 | sed -n '1,12p'
          # 自检：没签成 adhoc 就让 CI 挂掉，别把签不上的包发出去
          if ! codesign -dv --verbose=4 ShenglinVcam.dylib 2>&1 | grep -qi "adhoc"; then
            echo "::error::dylib 没有签成 adhoc"
            exit 1
          fi

      # 失败时把日志回传到 commit comment —— Actions 日志接口要鉴权，
      # 公开可读的 commit comment 是唯一能匿名取到的通道
      - name: Report build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/ci_report.sh

      - name: Package deb
        run: |
          VER=$(grep '^Version:' control | awk '{print $2}' | tr -d '\r')
          python3 make_deb.py --control control \
            --dylib ShenglinVcam.dylib --plist ShenglinVcam.plist \
            --dylib-name ShenglinVcam.dylib \
            --out "ShenglinVcam-v${VER}.deb"

      - name: Resolve artifact name
        id: art
        run: |
          VER=$(grep '^Version:' control | awk '{print $2}' | tr -d '\r')
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "name=ShenglinVcam-v${VER}" >> "$GITHUB_OUTPUT"
          # 交付件一律带版本号：手上同时留好几个版本时，靠文件名就能分清
          cp -f ShenglinVcam.dylib "ShenglinVcam-v${VER}.dylib"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: |
            ShenglinVcam-v*.dylib
            ShenglinVcam.plist
            ShenglinVcam-v*.deb

      # 构建成功就发 Release —— Actions 的 artifact 下载要登录，
      # Release 资产是公开直链，手机/电脑都能直接下
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.art.outputs.ver }}
          name: ShenglinVcam ${{ steps.art.outputs.ver }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            ShenglinVcam-v${{ steps.art.outputs.ver }}.dylib
            ShenglinVcam-v${{ steps.art.outputs.ver }}.deb
          fail_on_unmatched_files: true
